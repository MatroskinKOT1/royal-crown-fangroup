<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101722">
<meta name="description" content="Административная панель Royal Crown: Kingdom Wars | FANGroup">
<title>Админ-панель | Royal Crown FANGroup</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #101722;
    --panel: #192536;
    --panel2: #202f43;
    --gold: #d8b56a;
    --text: #f1f3f6;
    --muted: #aab5c4;
    --green: #55c98a;
    --red: #e47777;
    --border: rgba(216,181,106,.25);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

header {
    padding: 25px 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: #131e2c;
}

header h1 {
    margin: 0;
    color: var(--gold);
    font-size: 24px;
}

header p {
    color: var(--muted);
    font-size: 13px;
}

.container {
    max-width: 950px;
    margin: 25px auto;
    padding: 0 15px;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
}

h2 {
    color: var(--gold);
    font-size: 19px;
    margin-top: 0;
}

input {
    width: 100%;
    padding: 13px;
    margin: 7px 0 12px;
    background: #101722;
    color: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
}

button {
    padding: 11px 16px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin: 4px;
}

.primary {
    background: var(--gold);
    color: #17202c;
}

.approve {
    background: var(--green);
    color: #10251b;
}

.reject {
    background: var(--red);
    color: #2b1111;
}

.secondary {
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

.hidden {
    display: none !important;
}

.message {
    color: var(--muted);
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 17px;
    margin: 13px 0;
}

.card h3 {
    color: var(--gold);
    margin-top: 0;
}

.field {
    margin: 10px 0;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.field strong {
    color: var(--gold);
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 3px;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 12px;
    background: #33445a;
    margin-bottom: 10px;
}

.status.pending {
    color: #f2d28b;
}

.status.approved {
    color: var(--green);
}

.status.rejected {
    color: var(--red);
}

.actions {
    margin-top: 15px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
}

footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 25px;
}
</style>
</head>

<body>

<header>
    <h1>ROYAL CROWN</h1>
    <p>KINGDOM WARS | FANGroup — Панель управления</p>
</header>

<main class="container">

    <section class="panel" id="loginPanel">
        <h2>Вход администратора</h2>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="Электронная почта"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Пароль"
                autocomplete="current-password"
                required
            >

            <button class="primary" id="loginButton" type="submit">
                Войти
            </button>
        </form>

        <div class="message" id="loginMessage"></div>
    </section>

    <section id="dashboard" class="hidden">

        <div class="panel">
            <h2>Управление объявлениями</h2>

            <div class="message" id="adminInfo"></div>

            <button class="primary" id="refreshButton">
                Обновить список
            </button>

            <button class="secondary" id="logoutButton">
                Выйти
            </button>
        </div>

        <div class="panel">
            <h2>Новые заявки</h2>
            <div id="pendingList">Загрузка...</div>
        </div>

        <div class="panel">
            <h2>Опубликованные объявления</h2>
            <div id="approvedList">Загрузка...</div>
        </div>

        <div class="panel">
            <h2>Отклонённые заявки</h2>
            <div id="rejectedList">Загрузка...</div>
        </div>

    </section>

</main>

<footer>
    Royal Crown: Kingdom Wars | FANGroup
</footer>

<script>
const SUPABASE_URL =
    "https://yzfnuczplssxyfovkrti.supabase.co";

// Вставь свой sb_publishable_ ключ
const SUPABASE_KEY =
    "sb_publishable_ow7zkRfzaS1oRg-Bjk5CzA_bWx9QOK0";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");
const loginMessage = document.getElementById("loginMessage");

function showLogin() {
    dashboard.classList.add("hidden");
    loginPanel.classList.remove("hidden");
}

function showDashboard() {
    loginPanel.classList.add("hidden");
    dashboard.classList.remove("hidden");
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const button = document.getElementById("loginButton");

    button.disabled = true;
    loginMessage.textContent = "Проверяем данные...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const { error } = await db.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            loginMessage.textContent =
                "Ошибка входа: " + error.message;
            return;
        }

        await checkAdmin();

    } catch (error) {
        loginMessage.textContent =
            "Ошибка: " + error.message;

    } finally {
        button.disabled = false;
    }
});

async function checkAdmin() {
    loginMessage.textContent = "Проверяем права администратора...";

    const {
        data: { user },
        error: authError
    } = await db.auth.getUser();

    if (authError || !user) {
        loginMessage.textContent =
            "Не удалось подтвердить авторизацию: " +
            (authError?.message || "Пользователь не найден");
        showLogin();
        return;
    }

    const { data, error } = await db
        .from("admin_users")
        .select("role")
        .eq("user_id", user.id)
        .maybeSingle();

    if (error) {
        loginMessage.textContent =
            "Ошибка проверки прав администратора: " +
            error.message;
        return;
    }

    if (!data) {
        loginMessage.textContent =
            "Для этой учётной записи не найдена запись администратора.";
        await db.auth.signOut();
        showLogin();
        return;
    }

    if (String(data.role).toLowerCase() !== "admin") {
        loginMessage.textContent =
            "У этой учётной записи нет прав администратора.";
        await db.auth.signOut();
        showLogin();
        return;
    }

    showDashboard();

    document.getElementById("adminInfo").textContent =
        "Вы вошли как " + user.email;

    loginMessage.textContent = "";

    await loadApplications();
}

async function logout() {
    await db.auth.signOut();
    showLogin();
    loginMessage.textContent = "Вы вышли из панели.";
}

function addField(parent, title, value) {
    const field = document.createElement("div");
    field.className = "field";

    const label = document.createElement("strong");
    label.textContent = title;

    const content = document.createElement("div");
    content.textContent = value || "Не указано";

    field.append(label, content);
    parent.appendChild(field);
}

function createCard(item, status) {
    const card = document.createElement("article");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = item.alliance_name;

    const badge = document.createElement("span");
    badge.className = "status " + status;

    const statusNames = {
        pending: "Ожидает проверки",
        approved: "Опубликовано",
        rejected: "Отклонено"
    };

    badge.textContent = statusNames[status] || status;

    card.append(title, badge);

    addField(card, "Королевство", item.kingdom_number);
    addField(card, "Требования к игрокам", item.player_requirements);
    addField(card, "Стиль игры", item.play_style);
    addField(card, "Руководитель / рекрутер", item.recruiter_name);

    const contact = document.createElement("div");
    contact.className = "field";

    const contactLabel = document.createElement("strong");
    contactLabel.textContent = "Ссылка для связи";

    const link = document.createElement("a");
    link.href = item.contact_link;
    link.textContent = "Открыть ссылку";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.style.color = "#d8b56a";

    contact.append(contactLabel, link);
    card.appendChild(contact);

    if (status === "pending") {
        const actions = document.createElement("div");
        actions.className = "actions";

        const approve = document.createElement("button");
        approve.className = "approve";
        approve.textContent = "✓ Одобрить";

        const reject = document.createElement("button");
        reject.className = "reject";
        reject.textContent = "✕ Отклонить";

        approve.onclick = () =>
            moderate(item.id, "approved", approve, reject);

        reject.onclick = () =>
            moderate(item.id, "rejected", approve, reject);

        actions.append(approve, reject);
        card.appendChild(actions);
    }

    const date = document.createElement("div");
    date.className = "message";
    date.textContent = "Дата подачи: " +
        new Date(item.created_at).toLocaleString("ru-RU");

    card.appendChild(date);

    return card;
}

async function loadApplications() {
    const lists = {
        pending: document.getElementById("pendingList"),
        approved: document.getElementById("approvedList"),
        rejected: document.getElementById("rejectedList")
    };

    Object.values(lists).forEach(el => {
        el.textContent = "Загрузка...";
    });

    const { data, error } = await db
        .from("alliance_recruitment")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        Object.values(lists).forEach(el => {
            el.textContent =
                "Ошибка загрузки: " + error.message;
        });
        return;
    }

    for (const [status, container] of Object.entries(lists)) {
        container.replaceChildren();

        const items = data.filter(item => item.status === status);

        if (!items.length) {
            container.textContent = "Заявок пока нет.";
            continue;
        }

        items.forEach(item => {
            container.appendChild(createCard(item, status));
        });
    }
}

async function moderate(id, status, approveButton, rejectButton) {
    const action = status === "approved" ? "одобрить" : "отклонить";

    if (!confirm("Вы действительно хотите " + action + " это объявление?")) {
        return;
    }

    approveButton.disabled = true;
    rejectButton.disabled = true;

    const { error } = await db.rpc(
        "moderate_alliance_recruitment",
        {
            p_id: id,
            p_status: status
        }
    );

    if (error) {
        alert("Не удалось изменить статус: " + error.message);
        approveButton.disabled = false;
        rejectButton.disabled = false;
        return;
    }

    alert(status === "approved"
        ? "Объявление опубликовано!"
        : "Заявка отклонена.");

    await loadApplications();
}

document.getElementById("refreshButton").addEventListener(
    "click",
    loadApplications
);

document.getElementById("logoutButton").addEventListener(
    "click",
    logout
);

(async function init() {
    const {
        data: { session },
        error
    } = await db.auth.getSession();

    if (error) {
        loginMessage.textContent =
            "Ошибка проверки сессии: " + error.message;
        return;
    }

    if (session) {
        await checkAdmin();
    }
})();
</script>

</body>
</html>
