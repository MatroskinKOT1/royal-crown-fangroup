<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101722">
<meta name="description" content="Герои Royal Crown: Kingdom Wars — характеристики, редкость, классы и навыки.">
<title>Герои | Royal Crown: Kingdom Wars — FANGroup</title><style>
:root {
  --bg: #101722;
  --panel: #182433;
  --panel2: #202f40;
  --gold: #d9b66b;
  --gold2: #f1d99b;
  --text: #f4f0e6;
  --muted: #aab5c2;
  --border: rgba(217,182,107,.25);
  --ur: #d9a64e;
  --ssr: #9b83df;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at top, #26374a 0, transparent 42%),
    var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 30px 16px 22px;
}

header h1 {
  color: var(--gold2);
  font-size: clamp(25px, 5vw, 38px);
  margin: 0 0 10px;
}

header p {
  color: var(--muted);
  margin: 0 auto;
  max-width: 650px;
  line-height: 1.5;
}

.back {
  display: inline-block;
  margin-top: 18px;
  padding: 10px 17px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--gold2);
  text-decoration: none;
}

.back:hover {
  background: rgba(217,182,107,.1);
}

.container {
  width: min(1200px, 94%);
  margin: auto;
  padding-bottom: 45px;
}

.stats {
  text-align: center;
  color: var(--muted);
  margin: 8px 0 20px;
}

.stats strong {
  color: var(--gold2);
}

.filters {
  background: rgba(24,36,51,.9);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 22px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}

.filters input,
.filters select {
  width: 100%;
  min-width: 0;
  padding: 12px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: #101a27;
  color: var(--text);
  outline: none;
}

.filters input:focus,
.filters select:focus {
  border-color: var(--gold);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 15px;
}

.card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(160deg, #26374a, #172331 75%);
  border: 1px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  transition: .2s;
}

.card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
  box-shadow: 0 8px 25px rgba(0,0,0,.25);
}

.portrait {
  width: 100%;
  aspect-ratio: 1 / 1.12;
  background: linear-gradient(145deg, #34465b, #192635);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.fallback {
  color: var(--gold2);
  font-size: 55px;
  font-weight: bold;
}

.card-info {
  padding: 11px;
}

.card h3 {
  font-size: 16px;
  margin: 0 0 9px;
  text-align: center;
}

.tags {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 5px;
}

.tag {
  font-size: 11px;
  padding: 5px 8px;
  border-radius: 20px;
  background: rgba(255,255,255,.08);
  color: var(--muted);
}

.tag.ur {
  color: #ffe0a0;
  background: rgba(217,166,78,.18);
}

.tag.ssr {
  color: #d9ccff;
  background: rgba(155,131,223,.2);
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 35px 10px;
  grid-column: 1 / -1;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 25px 12px;
}

/* Окно героя */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(0,0,0,.78);
  padding: 18px;
  overflow-y: auto;
  align-items: center;
  justify-content: center;
}

.modal.open {
  display: flex;
}

.modal-box {
  width: min(620px, 100%);
  max-height: 92vh;
  overflow-y: auto;
  background: #182433;
  border: 1px solid var(--gold);
  border-radius: 17px;
  padding: 20px;
  position: relative;
}

.close {
  position: absolute;
  top: 10px;
  right: 13px;
  border: 0;
  background: transparent;
  color: white;
  font-size: 29px;
  cursor: pointer;
}

.modal-top {
  display: flex;
  gap: 17px;
  align-items: center;
  padding-right: 25px;
}

.modal-image {
  width: 115px;
  height: 130px;
  flex-shrink: 0;
  border-radius: 10px;
  overflow: hidden;
  background: #29394b;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.modal-image .fallback {
  font-size: 45px;
}

.modal h2 {
  color: var(--gold2);
  margin: 0 0 10px;
}

.modal-meta {
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
}

.skills-title {
  color: var(--gold2);
  margin: 22px 0 12px;
}

.skill {
  background: #223246;
  border: 1px solid rgba(217,182,107,.15);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 9px;
}

.skill h4 {
  margin: 0 0 6px;
  color: #f1d99b;
}

.skill p {
  margin: 0;
  color: #c3ccd6;
  line-height: 1.5;
  font-size: 14px;
}

@media (max-width: 650px) {
  .filters {
    grid-template-columns: 1fr;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .card h3 {
    font-size: 14px;
  }

  .modal-top {
    align-items: flex-start;
  }

  .modal-image {
    width: 95px;
    height: 110px;
  }
}
</style></head><body><header>
  <h1>⚔️ Герои Royal Crown</h1>
  <p>Каталог героев Royal Crown: Kingdom Wars. Изучайте редкость, классы и доступную информацию о навыках.</p>
  <a class="back" href="index.html">← На главную FANGroup</a>
</header><main class="container">  <div class="stats">
    Всего героев в каталоге: <strong id="totalCount">21</strong>
    · Найдено: <strong id="foundCount">21</strong>
  </div>  <section class="filters">
    <input id="search" type="search" placeholder="🔎 Найти героя..."><select id="rarityFilter">
  <option value="">Все редкости</option>
  <option value="UR">UR</option>
  <option value="SSR">SSR</option>
</select>

<select id="classFilter">
  <option value="">Все классы</option>
  <option value="Пехота">Пехота</option>
  <option value="Лучник">Лучник</option>
  <option value="Маг">Маг</option>
  <option value="Не указано">Класс не указан</option>
</select>

  </section>  <section class="grid" id="heroGrid"></section></main><footer>
  Royal Crown: Kingdom Wars | FANGroup
</footer><div class="modal" id="heroModal">
  <div class="modal-box">
    <button class="close" id="closeModal" aria-label="Закрыть">×</button><div class="modal-top">
  <div class="modal-image" id="modalImage"></div>
  <div>
    <h2 id="modalName"></h2>
    <div class="modal-meta" id="modalMeta"></div>
  </div>
</div>

<h3 class="skills-title">Навыки героя</h3>
<div id="modalSkills"></div>

  </div>
</div><script>

  // UR

  {

  },
  {

  {

    rarity: "UR",
    heroClass: "Пехота",
    image: "yun.jpg",
    skills: []
  },
  {
    name: "Митридат",
    rarity: "UR",
    heroClass: "Не указано",
    image: "",
    skills: []
  },
  {
    name: "Артемида",
    rarity: "UR",
    heroClass: "Лучник",
    image: "artemida.jpg",
    skills: []
  },
  {
    name: "Катерина",
    rarity: "UR",
    heroClass: "Не указано",

  {

  {
    name: "Дракула",

  {
    name: "Хаттори Хандзо",
    rarity: "UR",

    image: "",
    skills: []
  },
  {
    name: "Кир",
    rarity: "UR",
    heroClass: "Маг",
    image: "cyrus.jpg",
    skills: []
  },
  {
    name: "Екатерина",
    rarity: "UR",
    heroClass: "Маг",
    image: "katrin.jpg",

  },

  // SSR

  {
    name: "Айви",
    rarity: "SSR",

  {
    name: "Ланселот",

  {

    name: "Робин",

    image: "robin.jpg",
    skills: []
  },
  {
    name: "Лилит",
    rarity: "SSR",
    heroClass: "Маг",
    image: "lilith.jpg",
    skills: []
  },
  {
    name: "Ния",
    rarity: "SSR",

  {

  {
    name: "Алвин",

  },
  {
    name: "Белла",
    rarity: "SSR",
    heroClass: "Маг",
    image: "bella.jpg",
    skills: []
  }

];

const grid = document.getElementById("heroGrid");
const search = document.getElementById("search");
const rarityFilter = document.getElementById("rarityFilter");
const classFilter = document.getElementById("classFilter");
const foundCount = document.getElementById("foundCount");

document.getElementById("totalCount").textContent = heroes.length;

function createPortrait(hero, modal = false) {
  const wrapper = document.createElement("div");

  if (modal) {
    wrapper.className = "modal-image";
  } else {
    wrapper.className = "portrait";
  }

  const fallback = document.createElement("span");
  fallback.className = "fallback";
  fallback.textContent = hero.name.charAt(0).toUpperCase();

  if (hero.image) {
    const img = document.createElement("img");
    img.src = "assets/heroes/" + hero.image;
    img.alt = hero.name;
    img.onerror = function() {
      this.remove();
      fallback.style.display = "block";
    };

    fallback.style.display = "none";
    wrapper.appendChild(fallback);
    wrapper.appendChild(img);
  } else {
    wrapper.appendChild(fallback);
  }

  return wrapper;
}

function renderHeroes() {
  const query = search.value.trim().toLowerCase();
  const rarity = rarityFilter.value;
  const heroClass = classFilter.value;

  const filtered = heroes.filter(hero => {
    const matchesName = hero.name.toLowerCase().includes(query);
    const matchesRarity = !rarity || hero.rarity === rarity;
    const matchesClass = !heroClass || hero.heroClass === heroClass;

    return matchesName && matchesRarity && matchesClass;
  });

  grid.innerHTML = "";
  foundCount.textContent = filtered.length;

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">Герои не найдены. Попробуйте изменить фильтры.</div>';
    return;
  }

  filtered.forEach(hero => {
    const card = document.createElement("article");
    card.className = "card";

    const portrait = createPortrait(hero);

    const info = document.createElement("div");
    info.className = "card-info";

    const title = document.createElement("h3");
    title.textContent = hero.name;

    const tags = document.createElement("div");
    tags.className = "tags";

    const rarityTag = document.createElement("span");
    rarityTag.className = "tag " + hero.rarity.toLowerCase();
    rarityTag.textContent = hero.rarity;

    const classTag = document.createElement("span");
    classTag.className = "tag";
    classTag.textContent = hero.heroClass;

    tags.appendChild(rarityTag);
    tags.appendChild(classTag);

    info.appendChild(title);
    info.appendChild(tags);

    card.appendChild(portrait);
    card.appendChild(info);

    card.addEventListener("click", () => openHero(hero));

    grid.appendChild(card);
  });
}

function openHero(hero) {
  const modal = document.getElementById("heroModal");
  const modalImage = document.getElementById("modalImage");
  const modalSkills = document.getElementById("modalSkills");

  modalImage.innerHTML = "";
  modalImage.appendChild(createPortrait(hero, true));

  document.getElementById("modalName").textContent = hero.name;

  document.getElementById("modalMeta").innerHTML =
    "Редкость: <strong>" + hero.rarity + "</strong><br>" +
    "Класс: <strong>" + hero.heroClass + "</strong>";

  modalSkills.innerHTML = "";

  if (hero.skills && hero.skills.length) {
    hero.skills.forEach((skill, index) => {
      const block = document.createElement("div");
      block.className = "skill";

      const title = document.createElement("h4");
      title.textContent = skill.name || ("Навык " + (index + 1));

      const description = document.createElement("p");
      description.textContent = skill.description || "Описание навыка будет добавлено.";

      block.appendChild(title);
      block.appendChild(description);
      modalSkills.appendChild(block);
    });
  } else {
    const block = document.createElement("div");
    block.className = "skill";

    const message = document.createElement("p");
    message.textContent = "Информация о навыках этого героя будет добавлена после обработки игровых материалов.";

    block.appendChild(message);
    modalSkills.appendChild(block);
  }

  modal.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeHero() {
  document.getElementById("heroModal").classList.remove("open");
  document.body.style.overflow = "";
}

search.addEventListener("input", renderHeroes);
rarityFilter.addEventListener("change", renderHeroes);
classFilter.addEventListener("change", renderHeroes);

document.getElementById("closeModal").addEventListener("click", closeHero);

document.getElementById("heroModal").addEventListener("click", event => {
  if (event.target.id === "heroModal") {
    closeHero();
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeHero();
  }
});

renderHeroes();
</script></body>
</html>
